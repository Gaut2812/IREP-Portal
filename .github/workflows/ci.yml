name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests (SQLite, fresh database)
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: testing
      JUDGE0_ADAPTER: fake
      DATABASE_URL: sqlite:///irep_ci.db
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/workers/requirements.txt
      - run: pip install -r ../workers/requirements.txt
      - name: Build the database from migrations and seed it
        run: |
          python -m alembic upgrade head
          python -m alembic check
          python seed/run_seed.py
      - name: Run the full API suite
        env:
          LINK_REPORT: ${{ github.workspace }}/api-links.json
        run: python -m pytest tests -q
      - name: Worker tests (Celery task and broker-less runner)
        run: python -m pytest ../workers/tests -q -p no:cacheprovider
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-links
          path: api-links.json

  migrations-postgres:
    name: Migrations on PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: irep_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/irep_ci
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt
      - name: Upgrade, compare with models, downgrade, upgrade again
        run: |
          python -m alembic upgrade head
          python -m alembic check
          python -m alembic downgrade base
          python -m alembic upgrade head

  web:
    name: Web typecheck, build and E2E
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: testing
      JUDGE0_ADAPTER: fake
      DATABASE_URL: sqlite:///irep_ci.db
      API_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r apps/api/requirements.txt
      - name: Seed the API database
        working-directory: apps/api
        run: |
          python -m alembic upgrade head
          python seed/run_seed.py
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install web dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: apps/web
        run: pnpm exec tsc --noEmit
      - name: Build
        working-directory: apps/web
        run: pnpm build
      - name: Install Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright
        working-directory: apps/web
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/e2e-links.json
        run: pnpm exec playwright test --reporter=line,json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-links
          path: e2e-links.json

  link-gate:
    name: Link gate (docs/INTERCONNECT.md)
    runs-on: ubuntu-latest
    needs: [api, web]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: reports
          merge-multiple: true
      - name: Every active link has a passing test
        run: python3 scripts/link_gate.py --pytest reports/api-links.json --playwright reports/e2e-links.json
