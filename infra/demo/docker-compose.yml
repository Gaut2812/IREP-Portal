# IREP public DEMO: demo accounts and demo data only, on one small VM behind Caddy (automatic HTTPS).
# NOT production: no Keycloak, demo adapters for every engine, no real email or SMS is ever sent.
# Step by step: README.md.   Run from this folder with a filled-in .env:
#   docker compose build && docker compose up -d
# Never put real students' or parents' data on this server.
name: irep-demo

x-app: &app
  image: irep-api:${IREP_VERSION:-demo}
  environment:
    ENVIRONMENT: demo                     # sign-in required (no anonymous demo profile); parents see their code on screen
    AUTH_PROVIDER: local                  # demo logins: password123
    OUTBOX_RUNNER: thread                 # no broker needed
    NOTIFY_ADAPTER: fake                  # never email or text anyone from the demo
    DATABASE_URL: postgresql+psycopg2://irep:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/irep
    JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY}
    PUBLIC_BASE_URL: https://${APP_DOMAIN:?set APP_DOMAIN}
    STORAGE_ADAPTER: local
    STORAGE_DIR: /data/uploads
  volumes:
    - uploads:/data/uploads
  logging: &logging
    driver: json-file
    options: {max-size: "20m", max-file: "3"}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: irep
      POSTGRES_DB: irep
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U irep -d irep"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *logging

  seed:                                   # one-off: migrations, then the demo data (idempotent; re-anchors dates to today)
    <<: *app
    command: ["sh", "-c", "python -m alembic upgrade head && python seed/run_seed.py"]
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}

  api:
    <<: *app
    build:
      context: ../..
      dockerfile: infra/prod/api.Dockerfile
    # one process: the in-process outbox dispatcher and live-class state stay in one place
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--proxy-headers", "--forwarded-allow-ips", "*"]
    restart: unless-stopped
    depends_on:
      seed: {condition: service_completed_successfully}

  web:
    image: irep-web:${IREP_VERSION:-demo}
    build:
      context: ../..
      dockerfile: infra/prod/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${APP_DOMAIN}/api/v1
    restart: unless-stopped
    depends_on: [api]
    logging: *logging

  caddy:
    image: irep-caddy:${IREP_VERSION:-demo}
    build:
      context: ../prod
      dockerfile: caddy.Dockerfile
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
      DEMO_GATE: ${DEMO_GATE:-gate}
      DEMO_GATE_USER: ${DEMO_GATE_USER:-irep}
      DEMO_GATE_HASH: ${DEMO_GATE_HASH:-}
      DEMO_GATE_TOKEN: ${DEMO_GATE_TOKEN:-}
      SIGNIN_RATE_PER_MIN: ${SIGNIN_RATE_PER_MIN:-120}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
