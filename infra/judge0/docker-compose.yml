# Local Judge0 CE code runner for the coding lab (screen 24) - DEVELOPMENT ONLY.
#   cp judge0.conf.example judge0.conf      # then set the passwords and AUTHN_TOKEN (judge0.conf is git-ignored)
#   docker compose -f infra/judge0/docker-compose.yml up -d
#   API: JUDGE0_ADAPTER=judge0 JUDGE0_URL=http://localhost:2358 JUDGE0_AUTH_TOKEN=<AUTHN_TOKEN from judge0.conf>
# Runs untrusted student code: never on the database host in production (CLAUDE.md rule 10). Needs a person's
# review before any shared use. Setup notes, including Docker Desktop on Windows: docs/deploy/JUDGE0.md.
x-judge0: &judge0
  image: judge0/judge0:1.13.1
  volumes:
    - ./judge0.conf:/judge0.conf:ro
  privileged: true                 # Judge0's isolate sandbox needs it (see docs/deploy/JUDGE0_REVIEW.md)
  restart: unless-stopped
  depends_on: [db, redis]
  # a runaway submission cannot take the machine down
  mem_limit: 2g
  cpus: 2
  pids_limit: 512
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  server:
    <<: *judge0
    container_name: irep-judge0
    ports:
      - "127.0.0.1:2358:2358"     # this machine only
  worker:
    <<: *judge0
    container_name: irep-judge0-worker
    command: ["./scripts/workers"]
  db:
    image: postgres:16.2
    container_name: irep-judge0-db
    env_file: judge0.conf
    volumes:
      - judge0-db:/var/lib/postgresql/data/
    restart: unless-stopped
  redis:
    image: redis:7.2.4
    container_name: irep-judge0-redis
    command: ["bash", "-c", "docker-entrypoint.sh --appendonly no --requirepass \"$$REDIS_PASSWORD\""]
    env_file: judge0.conf
    restart: unless-stopped

volumes:
  judge0-db:
