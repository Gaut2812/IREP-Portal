# Keycloak for local development and the Stage 1 demo (Master Plan: Identity layer).
#   docker compose -f infra/keycloak/docker-compose.yml up -d
#   apps/api/venv/Scripts/python apps/api/seed/sync_keycloak.py     # demo users from the portal DB
# Admin console: http://localhost:8081/admin (dev bootstrap admin below; never use in pilot)
# Pilot/scale: production mode (`start`) behind Caddy/ingress with PostgreSQL, not start-dev.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: irep-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8081        # token issuer = what the browser sees
      KC_HTTP_PORT: "8080"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./realm-irep.json:/opt/keycloak/data/import/realm-irep.json:ro
