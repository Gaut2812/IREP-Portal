# IREP server labs on ONE lab node (pilot: class-hours E2E node). NEEDS A PERSON'S REVIEW.
# Never run this on the database or API host: DockerSpawner needs the Docker socket, which
# is root-equivalent on this machine.
#
#   cp .env.example .env            # set IREP_LABS_SERVICE_TOKEN (openssl rand -hex 32); never commit .env
#   docker compose build            # hub + profile images
#   docker compose up -d
#
# The portal then uses LAB_ADAPTER=jupyterhub, JUPYTERHUB_URL=http://<lab-node>:8000,
# JUPYTERHUB_PUBLIC_URL=https://labs.<your-domain> and JUPYTERHUB_API_TOKEN=<the same token>.
name: irep-labs

services:
  jupyterhub:
    build: ./hub
    image: irep/lab-hub:1
    restart: unless-stopped
    env_file: .env
    environment:
      LAB_NETWORK: irep-labs-users
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock      # spawner; see the warning above
      - hub-data:/srv/jupyterhub/data
    ports:
      - "8000:8000"                                    # put TLS (Caddy or the cloud LB) in front; allow only the portal and students
    networks:
      - irep-labs-hub
      - irep-labs-users

  # profile images, built here so the spawner finds them locally (or push to your registry)
  lab-linux:
    build: ./images/linux
    image: irep/lab-linux:1
    profiles: ["images"]
  lab-ai-cpu:
    build: ./images/ai-cpu
    image: irep/lab-ai-cpu:1
    profiles: ["images"]
  lab-fullstack:
    build: ./images/fullstack
    image: irep/lab-fullstack:1
    profiles: ["images"]

networks:
  irep-labs-hub: {}
  irep-labs-users:
    name: irep-labs-users
    internal: true          # lab containers get no route out: no internet, no cloud metadata, no portal subnet

volumes:
  hub-data: {}
