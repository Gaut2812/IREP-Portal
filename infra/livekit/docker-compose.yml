# Local LiveKit media server for the live classroom (screen 07).
#   docker compose -f infra/livekit/docker-compose.yml up -d
#   then run the API with LIVE_CLASS_ADAPTER=livekit (defaults match this file).
# Production does NOT use this file: see livekit.prod.yaml and docs/deploy/LIVEKIT.md.
services:
  livekit:
    image: livekit/livekit-server:v1.9
    container_name: irep-livekit
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.dev.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"               # HTTP API and WebSocket signalling
      - "7881:7881"               # ICE over TCP (when UDP is blocked)
      - "52000-52100:52000-52100/udp"   # clear of Windows reserved ranges (netsh int ipv4 show excludedportrange udp)
    extra_hosts:
      - "host.docker.internal:host-gateway"   # webhooks to the API on the host
    restart: unless-stopped
