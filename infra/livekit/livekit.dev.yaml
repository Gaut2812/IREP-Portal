# LiveKit for local development (docker-compose.yml next to this file).
# Dev-only key and secret: they match the API defaults in apps/api/core/config.py.
port: 7880
bind_addresses: ["0.0.0.0"]
rtc:
  tcp_port: 7881
  port_range_start: 52000
  port_range_end: 52100
  use_external_ip: false
  node_ip: 127.0.0.1            # browsers on this machine reach the media ports on localhost
keys:
  devkey: irep_dev_livekit_secret_not_for_production
webhook:
  api_key: devkey
  urls:
    - http://host.docker.internal:8000/api/v1/webhooks/livekit
room:
  empty_timeout: 300            # seconds an empty room lives before room_finished
  departure_timeout: 20
logging:
  level: info
